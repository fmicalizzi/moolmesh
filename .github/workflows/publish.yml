name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # dry run: preflight + build only, never syncs or publishes

# Runners are pinned to ubuntu-24.04, not ubuntu-latest: moving to Ubuntu 26 is an explicit decision (#73).
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install with dev deps
        run: pip install -e ".[dev]" --quiet

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Validate test count extraction
        run: |
          COUNT=$(python -m pytest tests/ -q --co 2>&1 | tail -1 | grep -oP '^\d+')
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            echo "::error::Failed to extract test count (got: '$COUNT')"
            exit 1
          fi
          echo "Test count: $COUNT"

      - name: Validate version in pyproject.toml
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$VERSION" != "$TOML_VERSION" ]; then
            echo "::error::Tag version ($VERSION) != pyproject.toml version ($TOML_VERSION)"
            exit 1
          fi
          echo "Version match: $VERSION"

  sync-assets:
    needs: preflight
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Sync version to banner SVG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s|>v[0-9]\+\.[0-9]\+\.[0-9]\+<|>v${VERSION}<|" docs/cli-banner.svg

      - name: Count tests and sync to assets
        run: |
          pip install -e ".[dev]" --quiet 2>/dev/null
          COUNT=$(python -m pytest tests/ -q --co 2>&1 | tail -1 | grep -oP '^\d+')
          if [ -n "$COUNT" ]; then
            python -c "
          import re, pathlib
          # Landing page: update the number before 'Tests passing'
          html = pathlib.Path('docs/index.html').read_text()
          html = re.sub(
              r'(<span class=\"val\">)\d+(</span>\s*<span class=\"label\">Tests passing)',
              rf'\g<1>${COUNT}\2', html)
          pathlib.Path('docs/index.html').write_text(html)
          "
            sed -i "s|Tests-[0-9]\+%20passing|Tests-${COUNT}%20passing|g" README.md README.es.md
            sed -i "s|Tests: [0-9]\+ passing|Tests: ${COUNT} passing|g" README.md README.es.md
            sed -i "s|^[0-9]\+ tests\. |${COUNT} tests. |" README.md README.es.md
            sed -i "s|contains [0-9]\+ tests|contains ${COUNT} tests|g" CONTRIBUTING.md
            echo "Updated test count to ${COUNT}"
          fi

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add docs/cli-banner.svg docs/index.html README.md README.es.md CONTRIBUTING.md && git commit -m "chore: sync version, test count to ${GITHUB_REF_NAME} [skip ci]" && git push origin main)

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Check dist (dry run only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          ls -l dist/
          pip install twine
          twine check dist/*

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
